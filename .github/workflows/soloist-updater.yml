name: Soloist updater

on:
  pull_request:
    paths:
      - "Bin/extract-soloist-update.sh"
      - "Bin/soloist-bridge.sh"
      - "Plugin.pm"
      - "Settings.pm"
      - "HTML/EN/plugins/SpotifySoloist/settings/basic.html"
      - "strings.txt"
      - "repo.xml"
      - ".github/workflows/soloist-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check POSIX shell syntax
        run: |
          dash -n Bin/extract-soloist-update.sh
          dash -n Bin/soloist-bridge.sh
      - name: Test managed update extractor
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          printf '\177ELFmanaged-soloist-test\n' > "$work/soloist"
          tar -C "$work" -czf "$work/valid.tar.gz" soloist
          dash Bin/extract-soloist-update.sh "$work/valid.tar.gz" "$work/candidate"
          cmp "$work/soloist" "$work/candidate"
          test "$(stat -c %a "$work/candidate")" = "700"

          printf 'not soloist\n' > "$work/README"
          tar -C "$work" -czf "$work/invalid.tar.gz" README
          if dash Bin/extract-soloist-update.sh "$work/invalid.tar.gz" "$work/rejected"; then
            echo "invalid archive was accepted" >&2
            exit 1
          fi
      - name: Check plugin Perl syntax
        run: perl contrib/check-plugin-syntax.pl
      - name: Validate current official Soloist build
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --silent --show-error \
            -o "$work/soloist.tar.gz" \
            https://soloist-builds.spotifycdn.com/soloist_release_x86_64.tar.gz
          Bin/extract-soloist-update.sh "$work/soloist.tar.gz" "$work/soloist"
          Bin/X86_64/glibc/ld-linux-x86-64.so.2 \
            --library-path "$PWD/Bin/X86_64:$PWD/Bin/X86_64/glibc" \
            "$work/soloist" --version \
            >"$work/version.txt" 2>&1
          cat "$work/version.txt"
          grep -Eq 'build [0-9]{10}|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' \
            "$work/version.txt"

  test-portable-arm-runtimes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - archive: arm32
            directory: ARMv7
            loader: ld-linux-armhf.so.3
            emulator: qemu-arm-static
          - archive: arm64
            directory: ARMv8_Arch64
            loader: ld-linux-aarch64.so.1
            emulator: qemu-aarch64-static
    steps:
      - uses: actions/checkout@v5
      - name: Install user-mode ARM emulation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
      - name: Validate official Soloist with private runtime
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --silent --show-error \
            -o "$work/soloist.tar.gz" \
            "https://soloist-builds.spotifycdn.com/soloist_release_${{ matrix.archive }}.tar.gz"
          Bin/extract-soloist-update.sh "$work/soloist.tar.gz" "$work/soloist"
          "${{ matrix.emulator }}" \
            "Bin/${{ matrix.directory }}/glibc/${{ matrix.loader }}" \
            --library-path "$PWD/Bin/${{ matrix.directory }}:$PWD/Bin/${{ matrix.directory }}/glibc" \
            "$work/soloist" --version >"$work/version.txt" 2>&1
          cat "$work/version.txt"
          grep -Eq 'build [0-9]{10}|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' \
            "$work/version.txt"
