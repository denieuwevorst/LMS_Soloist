name: Soloist updater

on:
  pull_request:
    paths:
      - "Bin/extract-soloist-update.sh"
      - "Bin/soloist-bridge.sh"
      - "Plugin.pm"
      - "ProtocolHandler.pm"
      - "Settings.pm"
      - "StreamSemantics.pm"
      - "contrib/experimental-pcm-shim/**"
      - "HTML/EN/plugins/SpotifySoloist/settings/basic.html"
      - "strings.txt"
      - "repo.xml"
      - "t/**"
      - ".github/workflows/soloist-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pcm-shims:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: X86_64
            compiler: gcc
            package: gcc
            machine: "x86-64"
          - directory: ARMv7
            compiler: arm-linux-gnueabihf-gcc
            package: gcc-arm-linux-gnueabihf
            machine: "ARM"
          - directory: ARMv8_Arch64
            compiler: aarch64-linux-gnu-gcc
            package: gcc-aarch64-linux-gnu
            machine: "aarch64"
    steps:
      - uses: actions/checkout@v5
      - name: Install shim compiler and headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse-dev ${{ matrix.package }}
      - name: Build bounded PCM shim
        run: |
          make -C contrib/experimental-pcm-shim clean
          make -C contrib/experimental-pcm-shim \
            CC=${{ matrix.compiler }} \
            CFLAGS="-O2 -Wall -Wextra -Werror"
          file contrib/experimental-pcm-shim/libpulse.so.0
          file contrib/experimental-pcm-shim/libpulse.so.0 | grep -q "${{ matrix.machine }}"
      - name: Upload bundled shim candidate
        uses: actions/upload-artifact@v4
        with:
          name: pcm-shim-${{ matrix.directory }}
          path: contrib/experimental-pcm-shim/libpulse.so.0
          if-no-files-found: error
      - name: Verify bundled shim is current
        run: |
          cmp \
            contrib/experimental-pcm-shim/libpulse.so.0 \
            "Bin/${{ matrix.directory }}/libpulse.so.0"

  test-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PCM shim build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse-dev
      - name: Check POSIX shell syntax
        run: |
          dash -n Bin/extract-soloist-update.sh
          dash -n Bin/soloist-bridge.sh
      - name: Test managed update extractor
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          printf '\177ELFmanaged-soloist-test\n' > "$work/soloist"
          tar -C "$work" -czf "$work/valid.tar.gz" soloist
          dash Bin/extract-soloist-update.sh "$work/valid.tar.gz" "$work/candidate"
          cmp "$work/soloist" "$work/candidate"
          test "$(stat -c %a "$work/candidate")" = "700"

          printf 'not soloist\n' > "$work/README"
          tar -C "$work" -czf "$work/invalid.tar.gz" README
          if dash Bin/extract-soloist-update.sh "$work/invalid.tar.gz" "$work/rejected"; then
            echo "invalid archive was accepted" >&2
            exit 1
          fi
      - name: Check plugin Perl syntax
        run: perl contrib/check-plugin-syntax.pl
      - name: Test stream semantics and direct FIFO handler
        run: |
          prove -v \
            t/stream_semantics.t \
            t/normalization.t \
            t/stale_catchup.t \
            t/direct_stream.t
          sh t/direct_fifo.sh
          sh t/pcm_shim_cadence.sh
          sh t/pcm_shim_smooth_soak.sh
          sh t/pcm_shim_live_ring.sh
          sh t/pcm_shim_generation_survival.sh
          sh t/private_loader_preload.sh
      - name: Validate current official Soloist build
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --silent --show-error \
            -o "$work/soloist.tar.gz" \
            https://soloist-builds.spotifycdn.com/soloist_release_x86_64.tar.gz
          Bin/extract-soloist-update.sh "$work/soloist.tar.gz" "$work/soloist"
          Bin/X86_64/glibc/ld-linux-x86-64.so.2 \
            --preload "$PWD/Bin/X86_64/libpulse.so.0" \
            --library-path "$PWD/Bin/X86_64:$PWD/Bin/X86_64/glibc" \
            "$work/soloist" --version \
            >"$work/version.txt" 2>&1
          cat "$work/version.txt"
          grep -q 'loaded build 2026-11-18.4-requestid' "$work/version.txt"
          grep -Eq 'build [0-9]{10}|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' \
            "$work/version.txt"

  test-portable-arm-runtimes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - archive: arm32
            directory: ARMv7
            loader: ld-linux-armhf.so.3
            emulator: qemu-arm
          - archive: arm64
            directory: ARMv8_Arch64
            loader: ld-linux-aarch64.so.1
            emulator: qemu-aarch64
    steps:
      - uses: actions/checkout@v5
      - name: Install user-mode ARM emulation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
      - name: Validate official Soloist with private runtime
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --silent --show-error \
            -o "$work/soloist.tar.gz" \
            "https://soloist-builds.spotifycdn.com/soloist_release_${{ matrix.archive }}.tar.gz"
          Bin/extract-soloist-update.sh "$work/soloist.tar.gz" "$work/soloist"
          "${{ matrix.emulator }}" \
            "Bin/${{ matrix.directory }}/glibc/${{ matrix.loader }}" \
            --preload "$PWD/Bin/${{ matrix.directory }}/libpulse.so.0" \
            --library-path "$PWD/Bin/${{ matrix.directory }}:$PWD/Bin/${{ matrix.directory }}/glibc" \
            "$work/soloist" --version >"$work/version.txt" 2>&1
          cat "$work/version.txt"
          grep -q 'loaded build 2026-11-18.4-requestid' "$work/version.txt"
          grep -Eq 'build [0-9]{10}|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' \
            "$work/version.txt"
