name: Soloist updater

on:
  pull_request:
    paths:
      - "Bin/extract-soloist-update.sh"
      - "Plugin.pm"
      - "Settings.pm"
      - "HTML/EN/plugins/SpotifySoloist/settings/basic.html"
      - "strings.txt"
      - ".github/workflows/soloist-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test managed update extractor
        run: |
          set -eu
          bash -n Bin/extract-soloist-update.sh
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          printf '\177ELFmanaged-soloist-test\n' > "$work/soloist"
          tar -C "$work" -czf "$work/valid.tar.gz" soloist
          Bin/extract-soloist-update.sh "$work/valid.tar.gz" "$work/candidate"
          cmp "$work/soloist" "$work/candidate"
          test "$(stat -c %a "$work/candidate")" = "700"

          printf 'not soloist\n' > "$work/README"
          tar -C "$work" -czf "$work/invalid.tar.gz" README
          if Bin/extract-soloist-update.sh "$work/invalid.tar.gz" "$work/rejected"; then
            echo "invalid archive was accepted" >&2
            exit 1
          fi
      - name: Check plugin Perl syntax
        run: perl contrib/check-plugin-syntax.pl
