name: Soloist updater

on:
  pull_request:
    paths:
      - "Bin/extract-soloist-update.sh"
      - "Plugin.pm"
      - "Settings.pm"
      - "HTML/EN/plugins/SpotifySoloist/settings/basic.html"
      - "strings.txt"
      - ".github/workflows/soloist-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test managed update extractor
        run: |
          set -eu
          bash -n Bin/extract-soloist-update.sh
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          printf '\177ELFmanaged-soloist-test\n' > "$work/soloist"
          tar -C "$work" -czf "$work/valid.tar.gz" soloist
          Bin/extract-soloist-update.sh "$work/valid.tar.gz" "$work/candidate"
          cmp "$work/soloist" "$work/candidate"
          test "$(stat -c %a "$work/candidate")" = "700"

          printf 'not soloist\n' > "$work/README"
          tar -C "$work" -czf "$work/invalid.tar.gz" README
          if Bin/extract-soloist-update.sh "$work/invalid.tar.gz" "$work/rejected"; then
            echo "invalid archive was accepted" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          repository: LMS-Community/slimserver
          path: lms
      - name: Check plugin Perl syntax against LMS
        run: |
          perl_version=$(perl -MConfig -e '$Config{version} =~ /^(\d+\.\d+)/; print $1')
          check='BEGIN {
            sub main::SCANNER () { 0 }
            sub main::PERFMON () { 0 }
            sub main::DEBUGLOG () { 0 }
            sub main::INFOLOG () { 0 }
            sub main::WEBUI () { 0 }
          } require shift'
          perl -I lms -I lms/CPAN -I "lms/CPAN/arch/$perl_version" -e "$check" ./Plugin.pm
          perl -I lms -I lms/CPAN -I "lms/CPAN/arch/$perl_version" -e "$check" ./Settings.pm
