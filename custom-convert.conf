# Soloist supplies one continuous 44.1 kHz stereo S16LE WAV source. PCM uses
# LMS's native WAV path; these rules select LMS-owned FLAC/MP3 conversion.

s16f flc * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -probesize 64 -analyzeduration 0 -i $FILE$ -map 0:a:0 -c:a flac -sample_fmt s16 -compression_level 0 -flush_packets 1 -f flac -

s16m96 mp3 * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -probesize 64 -analyzeduration 0 -i $FILE$ -map 0:a:0 -c:a libmp3lame -b:a 96k -flush_packets 1 -f mp3 -

