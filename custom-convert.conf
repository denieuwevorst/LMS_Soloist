# Soloist always supplies a streaming S32LE WAV source. Separate source types
# preserve the user's per-player output choice while LMS owns final conversion.

s32p pcm * *
	# IF
	[ffmpeg] -nostdin -hide_banner -loglevel error -probesize 64 -analyzeduration 0 -blocksize 4096 -i $FILE$ -map 0:a:0 -af aresample=osf=s16:dither_method=triangular,asetnsamples=n=512:p=0 -flush_packets 1 -f s16le -

s32f flc * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -probesize 64 -analyzeduration 0 -blocksize 4096 -i $FILE$ -map 0:a:0 -af aresample=osf=s16:dither_method=triangular -c:a flac -sample_fmt s16 -compression_level 0 -flush_packets 1 -f flac -

s32m96 mp3 * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -probesize 64 -analyzeduration 0 -blocksize 4096 -i $FILE$ -map 0:a:0 -c:a libmp3lame -b:a 96k -flush_packets 1 -f mp3 -

