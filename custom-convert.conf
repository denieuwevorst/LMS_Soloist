# Soloist always supplies a streaming S32LE WAV source. Separate source types
# preserve the user's per-player output choice while LMS owns final conversion.

s32p pcm * *
	# IF
	[ffmpeg] -nostdin -hide_banner -loglevel error -i $FILE$ -map 0:a:0 -f s32le -

s32f flc * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -i $FILE$ -map 0:a:0 -c:a flac -compression_level 0 -f flac -

s32m96 mp3 * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -i $FILE$ -map 0:a:0 -c:a libmp3lame -b:a 96k -f mp3 -

s32m128 mp3 * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -i $FILE$ -map 0:a:0 -c:a libmp3lame -b:a 128k -f mp3 -

s32m160 mp3 * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -i $FILE$ -map 0:a:0 -c:a libmp3lame -b:a 160k -f mp3 -

s32m192 mp3 * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -i $FILE$ -map 0:a:0 -c:a libmp3lame -b:a 192k -f mp3 -

s32m256 mp3 * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -i $FILE$ -map 0:a:0 -c:a libmp3lame -b:a 256k -f mp3 -

s32m320 mp3 * *
	# I
	[ffmpeg] -nostdin -hide_banner -loglevel error -i $FILE$ -map 0:a:0 -c:a libmp3lame -b:a 320k -f mp3 -
